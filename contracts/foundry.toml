# Contracts (M5, ADR-0013/0014). Review gate: math — every change needs founder review.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "write", path = "./deployments" }]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1_000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[lint]
# Deadlines and claim windows compare against block.timestamp by design (minutes-scale).
exclude_lints = ["block-timestamp"]

[fmt]
line_length = 100

# Slither (CI, slither.config.json here and at the repo root): the `timestamp` detector is
# excluded. Claim windows and signature deadlines compare against block.timestamp by design;
# validators can skew it by seconds, which is irrelevant at hour and day scales.
