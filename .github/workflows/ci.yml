name: CI

on:
  push:
    branches: [main, 'integration/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPLOY_ENV: ci
  DATA_TIER: sim
  FC_NUM_RUNS: '1000'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

# Actions are pinned to commit SHAs (tag in the trailing comment).
jobs:
  guards:
    name: Env guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails if DEV_LOGIN=true is combined with DATA_TIER≠sim, or appears in any deploy config.
      - run: pnpm check:guards

  checks:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-24.04
    needs: guards
    services:
      postgres:
        image: timescale/timescaledb:2.31.0-pg17
        env:
          POSTGRES_USER: euroedge
          POSTGRES_PASSWORD: euroedge
          POSTGRES_DB: euroedge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U euroedge" --health-interval 2s --health-timeout 3s
          --health-retries 30
      valkey:
        image: valkey/valkey:8.1.11-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://euroedge:euroedge@localhost:5432/euroedge
      VALKEY_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit messages (conventional commits)
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
      - run: pnpm format:check
      - run: pnpm lint:root && pnpm typecheck:root
      - run: pnpm db:migrate
      - run: pnpm turbo run lint typecheck test build

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  contracts:
    name: Contracts (Foundry + Slither)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      # Placeholder until contracts/ lands in M5-01: the remaining steps skip without it.
      - id: detect
        run: echo "present=${{ hashFiles('contracts/foundry.toml') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - if: steps.detect.outputs.present == 'true'
        working-directory: contracts
        run: forge fmt --check && forge build --sizes && forge test -vvv
      - if: steps.detect.outputs.present == 'true'
        uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        with:
          target: contracts
