packages:
  - apps/*
  - packages/*

# Install scripts are denied by default. lefthook's postinstall would
# auto-install git hooks; we run `pnpm hooks:install` explicitly instead.
allowBuilds:
  lefthook: false

# Single source of truth for versions shared across workspace packages.
catalog:
  '@types/node': 24.19.2
  typescript: 6.0.3
  vitest: 5.0.5
  '@vitest/coverage-v8': 5.0.5
  fast-check: 4.10.2
  kysely: 0.29.7
  zod: 4.6.7
  yaml: 2.9.1
  pg: 8.23.1
  '@types/pg': 8.23.1
