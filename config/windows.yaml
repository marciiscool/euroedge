# Risk parameters per window (brief §7.2, ADR-0016). Integers only (bps, ppm, leverage).
# priceLimit (max fill deviation from the index) is NOT fvBand (model confidence).
# fundingOiCapUsdc: net user OI skew (USDC at mark) at which the skew term reaches the window cap
# (ADR-0016). Proposed defaults, founder to confirm.
# Quote model (ADR-0003). PROPOSED values (ADR-0019), founder to confirm:
#   sigmaSpreadBps (a): share of σ_FV added to the half-spread; inventorySkewBps (s) at a house
#   inventory of inventoryCapUsdc; impactBps (γ) is the marginal impact at impactRefUsdc (x_ref),
#   convex with impactAlpha (α). A fill pays the average impact γ/(α+1)·(q/x_ref)^α.
windows:
  A:
    {
      stockMaxLeverage: 5,
      basketMaxLeverage: 10,
      priceLimitBps: 1000,
      takerFeeBps: 5,
      makerFeeBps: 1,
      houseHalfSpreadBps: 5,
      fundingCapPpmPerHour: 300,
      fundingOiCapUsdc: 2000000,
      sigmaSpreadBps: 1000,
      inventorySkewBps: 3,
      inventoryCapUsdc: 2000000,
      impactBps: 5,
      impactRefUsdc: 100000,
      impactAlpha: '1.5',
      inventoryHardCapUsdc: 4000000,
    }
  B:
    {
      stockMaxLeverage: 4,
      basketMaxLeverage: 10,
      priceLimitBps: 500,
      takerFeeBps: 8,
      makerFeeBps: 2,
      houseHalfSpreadBps: 10,
      fundingCapPpmPerHour: 200,
      fundingOiCapUsdc: 1000000,
      sigmaSpreadBps: 2500,
      inventorySkewBps: 5,
      inventoryCapUsdc: 1000000,
      impactBps: 10,
      impactRefUsdc: 100000,
      impactAlpha: '1.5',
      inventoryHardCapUsdc: 2000000,
    }
  C:
    {
      stockMaxLeverage: 3,
      basketMaxLeverage: 8,
      priceLimitBps: 400,
      takerFeeBps: 12,
      makerFeeBps: 3,
      houseHalfSpreadBps: 20,
      fundingCapPpmPerHour: 100,
      fundingOiCapUsdc: 500000,
      sigmaSpreadBps: 2500,
      inventorySkewBps: 10,
      inventoryCapUsdc: 500000,
      impactBps: 20,
      impactRefUsdc: 100000,
      impactAlpha: '1.5',
      inventoryHardCapUsdc: 1000000,
    }
  # D: ±min(3 %, 1/maxLev); skew add-on on fees arrives in M4.
  D:
    {
      stockMaxLeverage: 2,
      basketMaxLeverage: 5,
      priceLimitBps: 300,
      takerFeeBps: 20,
      makerFeeBps: 5,
      houseHalfSpreadBps: 35,
      fundingCapPpmPerHour: null,
      fundingOiCapUsdc: 0,
      sigmaSpreadBps: 2500,
      inventorySkewBps: 15,
      inventoryCapUsdc: 500000,
      impactBps: 30,
      impactRefUsdc: 100000,
      impactAlpha: '1.5',
      inventoryHardCapUsdc: 1000000,
    }
maintenanceMarginBps: { stock: 1000, basket: 500 }
liquidationPenaltyBps: { stock: 100, basket: 50 }
# Partial liquidation (M4): close just enough of the triggering position to restore equity to
# MM × (1 + buffer). Proposed default 25 %, founder to confirm.
partialLiquidationBufferBps: 2500
fundingInterestBpsPerYear: 500
# House risk (ADR-0003 §7, M4-14). Past inventoryCapUsdc the house quotes one side only; past
# inventoryHardCapUsdc the market is reduce-only. A house loss above the daily limit (UTC day)
# makes every market reduce-only until the next day. PROPOSED values (ADR-0019).
houseDailyLossLimitUsdc: 2500000
# Flow shift (ADR-0003 step 4): quotes (never FV, index or mark) shift with decayed net user
# flow, capped at ±h/2. PROPOSED values (ADR-0019), founder to confirm.
flow: { kappaPpmPerMUsdc: 100, tauSec: 300, walletCapUsdc: 250000, walletWindowSec: 60 }
markStepCapBpsPerSecond: 50
