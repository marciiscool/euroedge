# Xetra (Deutsche Börse cash market). Times are Europe/Berlin.
# The 13:00 intraday auction (2 min + random end) is treated as continuous trading.
venue: XETR
name: Xetra
tz: Europe/Berlin
coverage: { from: '2026-01-01', to: '2028-12-31' }
sources:
  - years: [2026, 2027, 2028]
    url: https://www.deutsche-boerse-cash-market.com/dbcm-en/trading/trading-calendar-and-trading-hours
    retrieved: null
    verified: false
    note: 'Cross-checked against exchange_calendars 4.13.2 (committed fixture); not yet checked against the official venue publication (host unreachable from the build environment).'
regular:
  days: [1, 2, 3, 4, 5]
  phases:
    preOpen: { open: '07:30', close: '08:50' }
    openingAuction: { open: '08:50', close: '09:00', randomEndSec: 30 }
    continuous: { open: '09:00', close: '17:30' }
    closingAuction: { open: '17:30', close: '17:35', randomEndSec: 30 }
    postTrading: { open: '17:35', close: '20:00' }
holidays:
  - { date: '2026-01-01', name: New Year's Day }
  - { date: '2026-04-03', name: Good Friday }
  - { date: '2026-04-06', name: Easter Monday }
  - { date: '2026-05-01', name: Labour Day }
  - { date: '2026-12-24', name: Christmas Eve }
  - { date: '2026-12-25', name: Christmas Day }
  - { date: '2026-12-31', name: New Year's Eve }
  - { date: '2027-01-01', name: New Year's Day }
  - { date: '2027-03-26', name: Good Friday }
  - { date: '2027-03-29', name: Easter Monday }
  - { date: '2027-12-24', name: Christmas Eve }
  - { date: '2027-12-31', name: New Year's Eve }
  - { date: '2028-04-14', name: Good Friday }
  - { date: '2028-04-17', name: Easter Monday }
  - { date: '2028-05-01', name: Labour Day }
  - { date: '2028-12-25', name: Christmas Day }
  - { date: '2028-12-26', name: Boxing Day }
specialSessions:
  - date: '2026-12-30'
    name: Last trading day of the year
    phases: &lastDay
      preOpen: { open: '07:30', close: '08:50' }
      openingAuction: { open: '08:50', close: '09:00', randomEndSec: 30 }
      continuous: { open: '09:00', close: '14:00' }
      closingAuction: { open: '14:00', close: '14:05', randomEndSec: 30 }
      postTrading: { open: '14:05', close: '17:00' }
  - { date: '2027-12-30', name: Last trading day of the year, phases: *lastDay }
  - { date: '2028-12-29', name: Last trading day of the year, phases: *lastDay }
