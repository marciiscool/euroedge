# US overnight ATS session (Sunday–Thursday 20:00 → 04:00 New York). Each session belongs to the
# next US trade date, so it does not run on the evening before a US market holiday.
venue: USON
name: US overnight session
tz: America/New_York
coverage: { from: '2026-01-01', to: '2028-12-31' }
tradeDateOffsetDays: 1
sources:
  - years: [2026, 2027, 2028]
    url: https://blueocean-tech.io/
    retrieved: null
    verified: false
    note: Mirrors the XNYS holiday list; overnight sessions before early-close days run normally. Founder to verify the overnight venue's own calendar.
regular:
  days: [7, 1, 2, 3, 4]
  phases:
    continuous: { open: '20:00', close: '04:00' }
