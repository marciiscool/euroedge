# OTC Markets (OTC ADRs such as SIEGY, LVMUY). Times are America/New_York.
# preOpen/postTrading; the opening and closing crosses are instantaneous and not modelled.
venue: OTCM
name: OTC Markets
tz: America/New_York
coverage: { from: '2026-01-01', to: '2028-12-31' }
sources:
  - years: [2026, 2027, 2028]
    url: https://www.otcmarkets.com/market-hours
    retrieved: null
    verified: false
    note: 'Assumed to follow the XNYS holiday and early-close schedule; no independent cross-check.'
regular:
  days: [1, 2, 3, 4, 5]
  phases:
    preOpen: { open: '04:00', close: '09:30' }
    continuous: { open: '09:30', close: '16:00' }
    postTrading: { open: '16:00', close: '20:00' }
